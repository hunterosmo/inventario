<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                template="./../plantillas/admin.xhtml">

    <ui:define name="title">
        Area Management
    </ui:define>

    <ui:define name="content">
        <h:form id="formArea">
            <p:growl id="mensajes" showDetail="true" />

            <p:commandButton value="New Area" icon="pi pi-plus"
                             actionListener="#{areaControl.limpiarFormulario}"
                             update=":formAgregar"
                             oncomplete="PF('dialogAgregar').show()" />

            <p:dataTable value="#{areaControl.listaAreas}" var="a"
                         paginator="true" rows="6" style="margin-top:20px"
                         emptyMessage="No records found"
                         rowKey="#{a.idArea}" selectionMode="single"
                         selection="#{areaControl.area}">

                <p:column headerText="ID">
                    <h:outputText value="#{a.idArea}" />
                </p:column>
                <p:column headerText="Name">
                    <h:outputText value="#{a.nombre}" />
                </p:column>
                <p:column headerText="Actions">
                    <p:commandButton icon="pi pi-pencil" title="Edit"
                                     actionListener="#{areaControl.setArea(a)}"
                                     update=":formEditar"
                                     oncomplete="PF('dialogEditar').show()" />
                    <p:commandButton icon="pi pi-trash" title="Delete"
                                     actionListener="#{areaControl.setArea(a)}"
                                     oncomplete="PF('confirmarEliminar').show()" />
                </p:column>
            </p:dataTable>
        </h:form>

        <!-- Add Dialog -->
        <p:dialog header="New Area" modal="true" widgetVar="dialogAgregar" resizable="false">
            <h:form id="formAgregar">
                <h:panelGrid columns="2" cellpadding="5">
                    <h:outputLabel for="nombreA" value="Name:"/>
                    <p:inputText id="nombreA" value="#{areaControl.area.nombre}" required="true"/>
                </h:panelGrid>
                <p:commandButton value="Save" icon="pi pi-save"
                                 actionListener="#{areaControl.agregarArea}"
                                 update=":formArea :formAgregar"
                                 oncomplete="PF('dialogAgregar').hide()" />
            </h:form>
        </p:dialog>

        <!-- Edit Dialog -->
        <p:dialog header="Edit Area" modal="true" widgetVar="dialogEditar" resizable="false">
            <h:form id="formEditar">
                <h:panelGrid columns="2" cellpadding="5">
                    <h:outputLabel for="nombreE" value="Name:"/>
                    <p:inputText id="nombreE" value="#{areaControl.area.nombre}" required="true"/>
                </h:panelGrid>
                <p:commandButton value="Update" icon="pi pi-refresh"
                                 actionListener="#{areaControl.modificarArea}"
                                 update=":formArea :formEditar"
                                 oncomplete="PF('dialogEditar').hide()" />
            </h:form>
        </p:dialog>

        <!-- Confirm Delete -->
        <p:confirmDialog header="Confirm" widgetVar="confirmarEliminar"
                         message="Are you sure you want to delete this area?" showEffect="fade" hideEffect="fade">
            <h:form>
                <p:commandButton value="Yes" icon="pi pi-check"
                                 actionListener="#{areaControl.eliminarArea}"
                                 update=":formArea"
                                 oncomplete="PF('confirmarEliminar').hide()" />
                <p:commandButton value="No" icon="pi pi-times"
                                 onclick="PF('confirmarEliminar').hide()" type="button" />
            </h:form>
        </p:confirmDialog>
    </ui:define>

</ui:composition>
